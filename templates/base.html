<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>National School Soccer Competition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="nav-link" href="/admin">Admin</a>
        <a class="navbar-brand fw-bold" href="/">School Soccer</a>

        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('schools') }}">Schools</a>
            <a class="nav-link" href="/competitions">Competitions</a>
            <a class="nav-link" href="/fixtures">Fixtures</a>
            <a class="nav-link" href="/register-school">Register</a>
            <a class="nav-link" href="/downloads">Downloads</a>
            <a class="nav-link" href="/contact">Contact</a>
            
            <a class="nav-link" href="/upload-schools">Upload Schools</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
