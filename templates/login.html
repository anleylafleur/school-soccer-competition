<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FIFA Registry Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .login-card{
            max-width:500px;
            margin:auto;
            margin-top:80px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,.15);
        }

        .header{
            background:#003366;
            color:white;
            padding:20px;
            text-align:center;
            border-radius:15px 15px 0 0;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card login-card">

        <div class="header">
            <div class="logo">⚽ FIFA Registry</div>
            <div>School & Player Registration Portal</div>
        </div>

        <div class="card-body p-4">

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Email Address
                    </label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Password
                    </label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>
                </div>

                <div class="d-grid">
                    <button type="submit"
                            class="btn btn-primary">
                        Login
                    </button>
                </div>

            </form>

            <hr>

            <div class="text-center">
                Don't have an account?
                <a href="{{ url_for('signup') }}">
                    Create Account
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
