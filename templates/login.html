<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.login-card{
    max-width:450px;
    margin:auto;
    margin-top:120px;
}

</style>

</head>

<body>

<div class="container">

<div class="card shadow login-card">

<div class="card-body p-5">

<h3 class="text-center mb-4">
FIFA Registry
</h3>

<form method="POST">

<div class="mb-3">
<input
type="email"
name="email"
class="form-control"
placeholder="Email"
required>
</div>

<div class="mb-3">
<input
type="password"
name="password"
class="form-control"
placeholder="Password"
required>
</div>

<button
class="btn btn-dark w-100">

Login

</button>

</form>

<div class="text-center mt-3">

<a href="{{ url_for('signup') }}">

Create Account

</a>

</div>

</div>

</div>

</div>

</body>

</html>
