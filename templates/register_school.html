{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Register School</h2>
    <form method="post" class="mt-3">
        <div class="mb-3"><label class="form-label">School Name</label><input class="form-control" name="school_name" required></div>
        <div class="mb-3"><label class="form-label">School Type</label>
            <select class="form-select" name="school_type" required><option>Public</option><option>Catholic</option><option>Independent</option></select>
        </div>
        <div class="mb-3"><label class="form-label">State Code</label>
            <select class="form-select" name="state_code" required><option>NSW</option><option>VIC</option><option>QLD</option><option>SA</option><option>WA</option><option>TAS</option><option>ACT</option><option>NT</option></select>
        </div>
        <div class="mb-3"><label class="form-label">Region</label><input class="form-control" name="region"></div>
        <div class="mb-3"><label class="form-label">Contact Name</label><input class="form-control" name="contact_name"></div>
        <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email"></div>
        <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
        <button class="btn btn-success">Submit Registration</button>
    </form>
</div>
{% endblock %}
