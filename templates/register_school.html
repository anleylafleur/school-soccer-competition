{% extends "base.html" %}

{% block content %}

<h2>Register School</h2>

<form method="POST" class="mt-3">

    <div class="mb-3">
        <label>School Name</label>
        <input name="school_name" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>School Type</label>
        <select name="school_type" class="form-select">
            <option>Public School</option>
            <option>Catholic School</option>
            <option>Independent/Private School</option>
        </select>
    </div>

    <div class="mb-3">
        <label>State</label>
        <select name="state_code" class="form-select">
            <option>NSW</option>
            <option>QLD</option>
            <option>VIC</option>
            <option>SA</option>
            <option>ACT</option>
        </select>
    </div>

    <div class="mb-3">
        <label>Region</label>
        <input name="region" class="form-control">
    </div>

    <div class="mb-3">
        <label>Contact Name</label>
        <input name="contact_name" class="form-control">
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input name="email" type="email" class="form-control">
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input name="phone" class="form-control">
    </div>

    <button class="btn btn-success">Submit Registration</button>

</form>

{% endblock %}
