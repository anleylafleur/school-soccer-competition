{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Upload Schools</h2>
    <p class="text-muted">Upload an Excel file with columns: SchoolName, SchoolType, StateCode, Region, ContactName, Email, Phone.</p>
    <form method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
        <div class="mb-3"><input type="file" name="excel_file" class="form-control" accept=".xlsx,.xls" required></div>
        <button class="btn btn-primary">Upload</button>
    </form>
</div>
{% endblock %}
