{% extends "base.html" %}

{% block content %}

<h2>Upload Schools from Excel</h2>

<p class="text-muted">
    Required columns: SchoolName, SchoolType, StateCode, Region, ContactName, Email, Phone
</p>

<form method="POST" enctype="multipart/form-data" class="mt-3">

    <div class="mb-3">
        <label class="form-label">Select Excel File</label>
        <input type="file" name="excel_file" class="form-control" accept=".xlsx,.xls" required>
    </div>

    <button class="btn btn-success">Upload Schools</button>

</form>

{% endblock %}
