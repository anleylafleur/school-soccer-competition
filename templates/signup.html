<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5" style="max-width: 450px;">

    <h3 class="text-center mb-4">Create Account</h3>

    <form method="POST">

        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Username" disabled>
        </div>

        <div class="mb-3">
            <input type="email" name="email" class="form-control" placeholder="Email" disabled>
        </div>

        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" disabled>
        </div>

        <button class="btn btn-secondary w-100" disabled>
            Signup not enabled yet
        </button>

    </form>

    <div class="text-center mt-3">
        <a href="{{ url_for('login') }}">Back to login</a>
    </div>

</div>
</body>
</html>
