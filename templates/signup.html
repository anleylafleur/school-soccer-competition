<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .signup-card{
            max-width:600px;
            margin:auto;
            margin-top:50px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,.15);
        }

        .header{
            background:#0066cc;
            color:white;
            text-align:center;
            padding:20px;
            border-radius:15px 15px 0 0;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card signup-card">

        <div class="header">
            <h3>Create FIFA Registry Account</h3>
        </div>

        <div class="card-body p-4">

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Full Name
                    </label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Password
                    </label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        minlength="8"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Confirm Password
                    </label>
                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        required>
                </div>

                <div class="d-grid">
                    <button type="submit"
                            class="btn btn-success">
                        Create Account
                    </button>
                </div>

            </form>

            <hr>

            <div class="text-center">
                Already have an account?
                <a href="{{ url_for('login') }}">
                    Login Here
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
