{% extends "base.html" %}
{% block content %}
<div class="container-fluid">
    <h2 class="mb-3">{{ title }}</h2>
    <div class="table-responsive">
        <table class="table table-striped table-bordered table-sm">
            <thead class="table-dark"><tr>{% for col in columns %}<th>{{ col }}</th>{% endfor %}</tr></thead>
            <tbody>{% for row in records %}<tr>{% for value in row %}<td>{{ value }}</td>{% endfor %}</tr>{% endfor %}</tbody>
        </table>
    </div>
</div>
{% endblock %}
