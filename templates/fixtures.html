{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-3">Fixtures</h2>

    <div class="table-responsive">
        <table class="table table-striped table-bordered table-sm">
            <thead class="table-dark">
                <tr>
                    {% for col in columns %}
                    <th>{{ col }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in fixtures %}
                <tr>
                    {% for value in row %}
                    <td>{{ value }}</td>
                    {% endfor %}
                </tr>
                {% else %}
                <tr>
                    <td colspan="{{ columns|length }}" class="text-center">No fixtures found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>
{% endblock %}
