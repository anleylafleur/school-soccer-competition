{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>{{ action }} {{ config.label }}</h2>
    <form method="post" class="mt-3">
        {% for field in config.fields %}
        <div class="mb-3">
            <label class="form-label">{{ field }}</label>
            <input type="text" name="{{ field }}" class="form-control" value="{{ record[field] if record else '' }}">
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{{ url_for('list_records', entity=entity) }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
