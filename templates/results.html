{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Results</h2>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                {% for col in columns %}
                <th>{{ col }}</th>
                {% endfor %}
            </tr>
        </thead>

        <tbody>
            {% for row in results %}
            <tr>
                {% for value in row %}
                <td>{{ value }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
